<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonificações</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#f4f4f4;
        text-align:center;
    }

    h1{
        color:green;
    }

    table{
        margin:auto;
        width:70%;
        border-collapse:collapse;
        background:white;
    }

    th, td{
        border:1px solid #ccc;
        padding:10px;
    }

    th{
        background:green;
        color:white;
    }

    .campeao{
        background:gold;
        font-weight:bold;
    }

    button{
        margin:5px;
        padding:8px 12px;
        cursor:pointer;
    }
</style>
</head>
<body>

<h1>🏆 Bonificações da Semana</h1>

<table id="ranking">
    <thead>
        <tr>
            <th>Participante</th>
            <th>Pontos</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<br>
<a href="../index.html">Voltar</a>

<script>
let participantes = [
    {nome: "Maria", pontos: 150},
    {nome: "João", pontos: 120},
    {nome: "Ana", pontos: 95}
];

function atualizarTabela() {
    participantes.sort((a,b) => b.pontos - a.pontos);

    const tbody = document.querySelector("#ranking tbody");
    tbody.innerHTML = "";

    participantes.forEach((p, indice) => {
        const linha = document.createElement("tr");

        if(indice === 0){
            linha.classList.add("campeao");
        }

        linha.innerHTML = `
            <td>${p.nome}</td>
            <td>${p.pontos}</td>
            <td>
                <button onclick="adicionarPontos('${p.nome}', 2)">
                    +2 Pilha
                </button>

                <button onclick="adicionarPontos('${p.nome}', 5)">
                    +5 Bateria
                </button>

                <button onclick="adicionarPontos('${p.nome}', 10)">
                    +10 Eletrônico
                </button>
            </td>
        `;

        tbody.appendChild(linha);
    });
}

function adicionarPontos(nome, valor){
    let participante = participantes.find(p => p.nome === nome);
    participante.pontos += valor;
    atualizarTabela();
}

atualizarTabela();
</script>

</body>
</html>
