<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Portal Gamer</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header class="topo">
       <div class="conteiner">
        <div class="logo"> 🎮 Game<span>ZONE</span></div>

          <nav class="menu">

    <main>

                    <p class="tag">PORTAL GAMER</p>
                    <h1>O universo dos games em um só lugar.</h1>
                    <p>

                <div class="jogos-grid">
                    <article class="card">
                        <div class="capa">⚔️</div>

                            <span class="categoria">RPG</span>
