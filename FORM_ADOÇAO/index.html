<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario adoção </title>
</head>
<body>
    <main>
        <div class="header">
            <h1 id="titulo">Cadastro para adoção</h1>
            <p id="subtitulo">Complete os campos</p>
        </div>
       <form action="#" method="post" autocomplete="off">
           <fieldset class="Grupo">   
              <div class="campo">
                <label for="Nome"><strong>Nome</strong></label> 
                <input type="text" name="nome" id="nome" required>
              </div>
               <div class="campo">
                <label for="sobrenome"><strong>sobrenome</strong></label> 
                <input type="text" name="sobrenome" id="sobrenome" required>
              </div>
           <div class="campo">
                <label for="renda"><strongl>CPF</strongl></label> 
                <input type="CPF" name="CPF" id="CPF" required>
              </div>
            
              </div>
               <div class="campo">
                <label for="Renda"><strong>Qual sua renda mensal fixa</strong></label>
                <select id="senioridade" name="senioridade" required>
                    <option selected disabled value="">Selecione</option>
                    <option value="junior">Entre 1 e 2 Salarios minimos</option>
                    <option value="pleno">Entre 3 e 6 Salarios minios </option>
                    <option value="senior">6 ou mais Salarios minimos</option>              
                 </select>
              </div>
              </fieldset>


              <div class="header">
            <h1 id="titulo">Informaçõe do animal que voce pretende adotar</h1>
            <p id="subtitulo">Responda</p>
        </div>
       <form action="#" method="post" autocomplete="off">
           <fieldset class="Grupo">   
              <div class="campo">
                <label for=""><strong>Raça</strong></label> 
                <input type="text" name="raça" id="raça" required>
              </div>

              <div class="campo">
                <label for="Renda"><strong>Qual animal voce pretende adotar</strong></label>
                <select id="animal" name="animal" required>
                    <option selected disabled value="">Selecione</option>
                    <option value="caramelo">Cachorro</option>
                    <option value="branco">Gato </option>
                    <option value="pelagem escura">Hamster</option>              
                 </select>
              </div>

              <div class="campo">
                <label for="Renda"><strong>Qual pelagem voce tem preferencia</strong></label>
                <select id="genero" name="genero" required>
                    <option selected disabled value="">Selecione</option>
                    <option value="caramelo">Caramelo</option>
                    <option value="branco">Branco </option>
                    <option value="pelagem escura">Pelagem escura</option>              
                 </select>
              </div>
            
            <div class="campo">
                 <label><strong>Qual porte voce tem preferencia</strong></label>
                 <label>
                    <input type="radio" name="devweb" value="pequeno" cheked>Pequeno
                 </label>
                 <label>
                    <input type="radio" name="devweb" value="medio" cheked>Medio
                 </label>
                 <label>
                    <input type="radio" name="devweb" value="grande" cheked>Grande
                 </label>
              </div>
               <div class="campo">
                <label for="Renda"><strong>Qual Genero voce tem preferencia</strong></label>
                <select id="genero" name="genero" required>
                    <option selected disabled value="">Selecione</option>
                    <option value="macho">Macho</option>
                    <option value="femea">femea </option>
                    <option value="sem preferencia">sem preferencia</option>              
                 </select>
              </div>
              </fieldset>
    </main>
    
</body>
</html>
